<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'">
  <title>Chrome 聚焦文本框验收</title>
  <style>
    body { max-width: 760px; margin: 40px auto; font: 16px/1.6 system-ui, sans-serif; color: #18181b; }
    label { display: block; margin: 18px 0 6px; font-weight: 650; }
    input, textarea, [contenteditable="true"] { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #a1a1aa; border-radius: 8px; font: inherit; }
    textarea { min-height: 100px; }
    [contenteditable="true"] { min-height: 80px; white-space: pre-wrap; }
    #neutral { margin-top: 24px; padding: 14px; border: 1px dashed #71717a; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Chrome 聚焦文本框验收</h1>
  <p>本页是离线夹具，不含提交按钮、网络脚本或站点适配。</p>

  <label for="single-line">普通单行文本框</label>
  <input id="single-line" type="text" value="单行预览 $x^2+1$">

  <label for="multi-line">普通多行文本框</label>
  <textarea id="multi-line">多行预览
$$\frac{1}{2}$$</textarea>

  <label for="editable">可访问 contenteditable</label>
  <div id="editable" contenteditable="true" role="textbox" aria-multiline="true">富文本预览 $a+b$</div>

  <label for="password">密码框，必须拒绝</label>
  <input id="password" type="password">

  <div id="neutral" tabindex="0">非文本焦点目标，用于验收没有聚焦文本框时拒绝。</div>
</body>
</html>
